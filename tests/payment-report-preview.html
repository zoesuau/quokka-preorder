<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="../style.css" />
    <title>顧客匯款回報介面檢查</title>
  </head>
  <body>
    <main>
      <section class="order-list">
        <article class="order-card">
          <div class="order-card-header">
            <div><h3>QK260729-DEMO02</h3><time>2026-07-29 15:10:00</time></div>
            <span class="order-status">待收訂金</span>
          </div>
          <pre>QUOKSCOUT Flattfur Keyring（鑰匙圈）｜BOBO × 2</pre>
          <div class="order-money">
            <div><span>商品總額</span><strong>NT$5,050</strong></div>
            <div><span>應付訂金</span><strong>NT$2,525</strong></div>
            <div><span>後續應付</span><strong>NT$2,525</strong></div>
          </div>
          <button class="payment-report-action" type="button">回報已匯款</button>
        </article>
      </section>
    </main>
    <dialog class="payment-report-dialog" open>
      <form>
        <div class="checkout-header">
          <div><p class="eyebrow">PAYMENT REPORT</p><h2>回報已匯款</h2></div>
          <button class="dialog-close" type="button" aria-label="關閉">×</button>
        </div>
        <p class="payment-report-order">訂單 QK260729-DEMO02｜應付訂金 NT$2,525</p>
        <label class="field">
          <span>匯款帳號後五碼 *</span>
          <input type="text" inputmode="numeric" maxlength="5" value="55555" />
        </label>
        <p class="payment-report-note">送出後訂單會進入「待確認訂金」，管理員核帳完成後才會改為「已收到訂金」。</p>
        <button class="primary-button" type="button">確認回報</button>
      </form>
    </dialog>
  </body>
</html>
